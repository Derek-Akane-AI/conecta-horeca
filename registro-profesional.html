<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Registro Profesional | Conecta HORECA</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
  <div class="logo">
    Conecta <span>HORECA</span>
  </div>

  <nav>
    <a href="index.html">Inicio</a>
    <a href="#">Iniciar sesión</a>
  </nav>
</header>

<main class="register-page">

  <div class="form-container">

    <div class="form-progress">
      Paso 1 de 4
    </div>

    <h1>Crea tu perfil profesional</h1>

    <p class="register-subtitle">
      Comencemos con tus datos básicos.
    </p>

    <form id="professionalForm">

      <div class="form-row">

        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Tu nombre"
            required
          >
        </div>

        <div class="form-group">
          <label for="apellido">Apellido</label>
          <input
            type="text"
            id="apellido"
            name="apellido"
            placeholder="Tu apellido"
            required
          >
        </div>

      </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="nombre@correo.com"
          required
        >
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono</label>

        <div class="phone-row">

          <select id="codigoPais" name="codigoPais">
            <option value="+506">🇨🇷 +506</option>
          </select>

          <input
            type="tel"
            id="telefono"
            name="telefono"
            placeholder="8888 8888"
            required
          >

        </div>
      </div>

      <div class="form-group">
        <label for="ubicacion">Ubicación</label>

        <select id="ubicacion" name="ubicacion" required>
          <option value="">Selecciona tu provincia</option>
          <option>San José</option>
          <option>Alajuela</option>
          <option>Cartago</option>
          <option>Heredia</option>
          <option>Guanacaste</option>
          <option>Puntarenas</option>
          <option>Limón</option>
        </select>
      </div>

      <div class="form-group">
        <label for="password">Crear contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Mínimo 8 caracteres"
          minlength="8"
          required
        >
      </div>

      <button type="submit" class="btn form-button">
        Continuar
      </button>

    </form>

    <a href="registro.html" class="back-link">
      ← Volver
    </a>

  </div>

</main>

</body>
</html>
