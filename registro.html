<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Crear cuenta | Conecta HORECA</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
  <div class="logo">
    Conecta <span>HORECA</span>
  </div>

  <nav>
    <a href="index.html">Inicio</a>
    <a href="#">Iniciar sesión</a>
  </nav>
</header>

<main class="register-page">

  <h1>Crear mi cuenta</h1>

  <p class="register-subtitle">
    ¿Cómo quieres utilizar Conecta HORECA?
  </p>

  <div class="account-types">

    <div class="account-card" onclick="window.location.href='registro-profesional.html'">
      <div class="icon">👤</div>

      <h2>Soy profesional</h2>

      <p>
        Busco trabajo y oportunidades.
      </p>
    </div>

    <div class="account-card" onclick="window.location.href='registro-empresa.html'" style="cursor: pointer;">
      <div class="icon">🏢</div>

      <h2>Soy empresa</h2>

      <p>
        Busco, contrato personal y servicios.
      </p>
    </div>

    <div class="account-card">
      <div class="icon">🤝</div>

      <h2>Soy proveedor</h2>

      <p>
        Ofrezco productos y servicios.
      </p>
    </div>

  </div>

  <a href="index.html" class="back-link">
    ← Volver al inicio
  </a>

</main>

</body>
</html>
