<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Perfil Profesional | Conecta HORECA</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
  <div class="logo">
    Conecta <span>HORECA</span>
  </div>

  <nav>
    <a href="index.html">Inicio</a>
    <a href="#">Iniciar sesión</a>
  </nav>
</header>

<main class="register-page">

  <div class="form-container">

    <div class="form-progress">
      Paso 2 de 4
    </div>

    <h1>Tu experiencia profesional</h1>

    <p class="register-subtitle">
      Cuéntanos sobre tu experiencia en la industria HORECA.
    </p>

    <form id="professionalProfileForm">

      <div class="form-group">
        <label for="areaPrincipal">Área principal</label>

        <select id="areaPrincipal" name="areaPrincipal" required>
          <option value="">Selecciona un área</option>
          <option value="restaurante">Restaurante</option>
          <option value="bar">Bar y Bebidas</option>
          <option value="cocina">Cocina</option>
          <option value="hoteleria">Hotelería</option>
          <option value="habitaciones">Habitaciones y limpieza</option>
          <option value="eventos">Eventos</option>
          <option value="administracion">Administración</option>
          <option value="operaciones">Operaciones</option>
        </select>
      </div>

      <div class="form-group">
        <label for="puestoPrincipal">Puesto principal</label>

        <select id="puestoPrincipal" name="puestoPrincipal" required disabled>
          <option value="">
            Primero selecciona un área
          </option>
        </select>
      </div>

      <div class="form-group">
        <label for="experiencia">Años de experiencia</label>

        <select id="experiencia" name="experiencia" required>
          <option value="">Selecciona</option>
          <option value="0">Menos de 1 año</option>
          <option value="1">1 año</option>
          <option value="2">2 años</option>
          <option value="3">3 años</option>
          <option value="4">4 años</option>
          <option value="5">5 años</option>
          <option value="6-9">6 a 9 años</option>
          <option value="10+">10 años o más</option>
        </select>
      </div>

      <div class="form-group">
        <label for="idiomaPrincipal">Idioma principal</label>

        <select id="idiomaPrincipal" name="idiomaPrincipal" required>
          <option value="">Selecciona</option>
          <option value="espanol">Español</option>
          <option value="ingles">Inglés</option>
          <option value="portugues">Portugués</option>
          <option value="frances">Francés</option>
          <option value="otro">Otro</option>
        </select>
      </div>

      <div class="form-group">
        <label for="segundoIdioma">
          Segundo idioma
          <span class="optional-text">(opcional)</span>
        </label>

        <select id="segundoIdioma" name="segundoIdioma">
          <option value="">Ninguno</option>
          <option value="espanol">Español</option>
          <option value="ingles">Inglés</option>
          <option value="portugues">Portugués</option>
          <option value="frances">Francés</option>
          <option value="otro">Otro</option>
        </select>
      </div>

      <div class="form-group">
        <label for="nivelSegundoIdioma">
          Nivel del segundo idioma
        </label>

        <select id="nivelSegundoIdioma" name="nivelSegundoIdioma">
          <option value="">Selecciona</option>
          <option value="basico">Básico</option>
          <option value="intermedio">Intermedio</option>
          <option value="avanzado">Avanzado</option>
          <option value="fluido">Fluido</option>
          <option value="nativo">Nativo</option>
        </select>
      </div>

      <div class="cv-upload">

        <div class="cv-icon">📄</div>

        <div>
          <strong>¿Ya tienes un currículum?</strong>

          <p>
            Más adelante podremos utilizarlo para completar
            automáticamente tu experiencia y habilidades.
          </p>
        </div>

        <label for="cv" class="upload-button">
          Seleccionar archivo
        </label>

        <input
          type="file"
          id="cv"
          name="cv"
          accept=".pdf,.doc,.docx"
          hidden
        >

        <div id="cvFileName" class="file-name"></div>

      </div>

      <button type="submit" class="btn form-button">
        Continuar
      </button>

    </form>

    <a href="registro-profesional.html" class="back-link">
      ← Volver
    </a>

  </div>

</main>

<script src="app.js"></script>

</body>
</html>
